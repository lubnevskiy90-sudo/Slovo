name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply update zip (if any)
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip, building as is"
            exit 0
          fi
          for z in "${zips[@]}"; do
            rm -rf /tmp/upd && mkdir /tmp/upd
            unzip -q -o "$z" -d /tmp/upd
            src=$(find /tmp/upd -maxdepth 2 -type d -name app | head -n 1)
            if [ -z "$src" ]; then
              echo "No app folder inside $z"
              exit 1
            fi
            cp -r "$src"/. app/
            git rm -q "$z"
          done
          cur=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          sed -i "s/versionCode = $cur/versionCode = $((cur+1))/" app/build.gradle.kts
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Apply update from zip"
          git push
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          fi
      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: slovodnya-apk
          path: app/build/outputs/apk/release/app-release.apk
